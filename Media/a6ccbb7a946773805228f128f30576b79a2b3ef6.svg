<svg viewbox="0 0 640 240" role="img" aria-label="Loop diagram: model generates code, runs public tests, feedback returns to the model on failure; on success, private tests determine the reward.">
  <rect x="30" y="94" width="106" height="46" rx="3" class="dg-box" />
  <text x="83" y="112" class="dg-label-b" text-anchor="middle">generate</text>
  <text x="83" y="128" class="dg-label" text-anchor="middle">code</text>

  <line x1="136" y1="117" x2="196" y2="117" class="dg-rule" stroke-width="1.5"></line>
  <polygon points="196,113 205,117 196,121" class="dg-ink"></polygon>

  <rect x="208" y="94" width="120" height="46" rx="3" class="dg-box" />
  <text x="268" y="112" class="dg-label-b" text-anchor="middle">public tests</text>
  <text x="268" y="128" class="dg-label" text-anchor="middle">iterate here</text>

  <path d="M 268 140 C 268 196 83 196 83 146" class="dg-stroke" stroke-width="1.6" fill="none" />
  <polygon points="79,150 83,140 87,150" class="dg-ink"></polygon>
  <text x="176" y="212" class="dg-label" text-anchor="middle">failure trace returned to the model</text>

  <line x1="328" y1="117" x2="392" y2="117" class="dg-rule" stroke-width="1.5"></line>
  <polygon points="392,113 401,117 392,121" class="dg-ink"></polygon>
  <text x="360" y="106" class="dg-label" text-anchor="middle">passes</text>

  <rect x="404" y="94" width="126" height="46" rx="3" class="dg-box" />
  <text x="467" y="112" class="dg-label-b" text-anchor="middle">private tests</text>
  <text x="467" y="128" class="dg-label" text-anchor="middle">reward only</text>

  <text x="467" y="62" class="dg-label" text-anchor="middle">never shown to the model —</text>
  <text x="467" y="78" class="dg-label" text-anchor="middle">so it cannot be memorised</text>
  <line x1="467" y1="84" x2="467" y2="92" class="dg-rule" stroke-width="1"></line>
</svg>
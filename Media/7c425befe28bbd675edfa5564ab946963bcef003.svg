<svg viewbox="0 0 640 400" role="img" aria-label="Balance sheets of the government and the Bank of Japan, then the two consolidated, showing the government bonds held by the central bank cancelling out and leaving foreign assets against bank reserves.">
  <!-- Row 1: two entities -->
  <text x="20" y="20" class="dg-label-b">GOVERNMENT (incl. FEFSA)</text>
  <rect x="20" y="30" width="130" height="110" class="dg-box" />
  <rect x="150" y="30" width="130" height="110" class="dg-box" />
  <text x="85" y="46" class="dg-label" text-anchor="middle">assets</text>
  <text x="215" y="46" class="dg-label" text-anchor="middle">liabilities</text>
  <text x="85" y="76" class="dg-label-b" text-anchor="middle">FX reserves</text>
  <text x="85" y="92" class="dg-label" text-anchor="middle">(US Treasuries,</text>
  <text x="85" y="106" class="dg-label" text-anchor="middle">dollar deposits)</text>
  <text x="215" y="76" class="dg-label-b" text-anchor="middle">JGBs</text>
  <text x="215" y="92" class="dg-label" text-anchor="middle">long-dated,</text>
  <text x="215" y="106" class="dg-label" text-anchor="middle">fixed rate</text>

  <text x="360" y="20" class="dg-label-b">BANK OF JAPAN</text>
  <rect x="360" y="30" width="130" height="110" class="dg-box" />
  <rect x="490" y="30" width="130" height="110" class="dg-box" />
  <text x="425" y="46" class="dg-label" text-anchor="middle">assets</text>
  <text x="555" y="46" class="dg-label" text-anchor="middle">liabilities</text>
  <text x="425" y="76" class="dg-label-b" text-anchor="middle">JGBs</text>
  <text x="425" y="92" class="dg-label" text-anchor="middle">bought through</text>
  <text x="425" y="106" class="dg-label" text-anchor="middle">two decades of QE</text>
  <text x="555" y="76" class="dg-label-b" text-anchor="middle">bank reserves</text>
  <text x="555" y="92" class="dg-label" text-anchor="middle">overnight,</text>
  <text x="555" y="106" class="dg-label" text-anchor="middle">floating rate</text>

  <!-- cancelling link -->
  <path d="M 215 140 C 215 175, 425 175, 425 140" class="dg-stroke" stroke-width="1.3" stroke-dasharray="4 3" />
  <text x="320" y="192" class="dg-label-b" text-anchor="middle">the state owes this to itself — it cancels</text>
  <line x1="196" y1="70" x2="236" y2="82" stroke="#8c2f16" stroke-width="2"></line>
  <line x1="406" y1="70" x2="446" y2="82" stroke="#8c2f16" stroke-width="2"></line>

  <!-- arrow down -->
  <line x1="320" y1="206" x2="320" y2="240" class="dg-stroke" stroke-width="1.3"></line>
  <path d="M 314 234 L 320 244 L 326 234 Z" class="dg-ink" />

  <!-- Row 2: consolidated -->
  <text x="120" y="266" class="dg-label-b">CONSOLIDATED PUBLIC SECTOR</text>
  <rect x="120" y="276" width="190" height="104" class="dg-box" />
  <rect x="310" y="276" width="190" height="104" class="dg-box" />
  <text x="215" y="292" class="dg-label" text-anchor="middle">assets</text>
  <text x="405" y="292" class="dg-label" text-anchor="middle">liabilities</text>
  <text x="215" y="320" class="dg-label-b" text-anchor="middle">foreign assets</text>
  <text x="215" y="338" class="dg-label" text-anchor="middle">&gt;56% of GDP, risky,</text>
  <text x="215" y="354" class="dg-label" text-anchor="middle">unhedged, higher-yielding</text>
  <text x="405" y="320" class="dg-label-b" text-anchor="middle">yen owed, mostly floating</text>
  <text x="405" y="338" class="dg-label" text-anchor="middle">bank reserves + JGBs</text>
  <text x="405" y="354" class="dg-label" text-anchor="middle">held outside the state</text>
</svg>
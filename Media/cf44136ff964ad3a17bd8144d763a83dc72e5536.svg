<svg viewbox="0 0 660 300" role="img" aria-label="Diagram showing pre-training feeding into three axes: train-time scaling, test-time scaling, and a self-improvement loop connecting them.">
  <rect x="20" y="120" width="130" height="58" rx="3" class="dg-box" />
  <text x="85" y="145" class="dg-label-b" text-anchor="middle">Pre-training</text>
  <text x="85" y="163" class="dg-label" text-anchor="middle">flattening</text>

  <line x1="150" y1="149" x2="215" y2="149" class="dg-rule" stroke-width="1.5"></line>
  <polygon points="215,145 224,149 215,153" class="dg-ink"></polygon>

  <rect x="228" y="34" width="180" height="66" rx="3" class="dg-box" />
  <text x="318" y="58" class="dg-label-b" text-anchor="middle">1 · Train-time scaling</text>
  <text x="318" y="76" class="dg-label" text-anchor="middle">RL on verifiable rewards,</text>
  <text x="318" y="90" class="dg-label" text-anchor="middle">post-training, distillation</text>

  <rect x="228" y="198" width="180" height="66" rx="3" class="dg-box" />
  <text x="318" y="222" class="dg-label-b" text-anchor="middle">2 · Test-time scaling</text>
  <text x="318" y="240" class="dg-label" text-anchor="middle">longer thinking, sampling,</text>
  <text x="318" y="254" class="dg-label" text-anchor="middle">search, verification</text>

  <path d="M 228 67 C 190 67 190 149 224 149" class="dg-rule" stroke-width="1.2" fill="none" />
  <path d="M 228 231 C 190 231 190 149 224 149" class="dg-rule" stroke-width="1.2" fill="none" />

  <path d="M 408 231 C 470 231 470 67 412 67" class="dg-stroke" stroke-width="1.6" fill="none" stroke-dasharray="5 4" />
  <polygon points="418,63 408,67 418,71" class="dg-ink"></polygon>
  <text x="530" y="140" class="dg-label-b" text-anchor="middle">3 · Self-improvement</text>
  <text x="530" y="158" class="dg-label" text-anchor="middle">solutions found by spending</text>
  <text x="530" y="172" class="dg-label" text-anchor="middle">compute at test time become</text>
  <text x="530" y="186" class="dg-label" text-anchor="middle">training data for the next model</text>
  <line x1="470" y1="118" x2="470" y2="132" class="dg-rule" stroke-width="1"></line>
</svg>
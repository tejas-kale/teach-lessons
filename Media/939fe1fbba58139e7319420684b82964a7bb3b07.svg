<svg viewbox="0 0 640 230" role="img" aria-label="Bar chart comparing the roughly 9.5 trillion yen historic cost of 95 billion dollars against the 15.2 trillion yen received when sold, leaving a 5.7 trillion yen gain.">
  <line x1="150" y1="30" x2="150" y2="185" class="dg-rule" stroke-width="1"></line>
  <rect x="150" y="45" width="228" height="42" class="dg-box" />
  <rect x="150" y="115" width="365" height="42" fill="#8c2f16" opacity="0.82" />
  <text x="140" y="72" class="dg-label" text-anchor="end">Cost, bought near ¥100</text>
  <text x="140" y="142" class="dg-label" text-anchor="end">Proceeds, sold at ¥160</text>
  <text x="388" y="72" class="dg-label-b" text-anchor="start">¥9.5trn</text>
  <text x="525" y="142" class="dg-label-b" text-anchor="start">¥15.2trn</text>
  <g class="dg-rule" stroke-width="1" stroke-dasharray="3 3">
    <line x1="378" y1="45" x2="378" y2="200"></line>
    <line x1="515" y1="115" x2="515" y2="200"></line>
  </g>
  <line x1="378" y1="196" x2="515" y2="196" class="dg-stroke" stroke-width="1.5"></line>
  <text x="446" y="218" class="dg-label-b" text-anchor="middle">gain ≈ ¥5.7trn ($36bn)</text>
</svg>
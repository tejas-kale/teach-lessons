<svg viewbox="0 0 640 190" role="img" aria-label="A number line of yen per dollar from 90 to 170, marked to show that a higher number means a weaker yen.">
  <line x1="60" y1="95" x2="580" y2="95" class="dg-rule" stroke-width="1.5"></line>
  <g class="dg-rule" stroke-width="1.5">
    <line x1="60" y1="88" x2="60" y2="102"></line>
    <line x1="190" y1="88" x2="190" y2="102"></line>
    <line x1="320" y1="88" x2="320" y2="102"></line>
    <line x1="450" y1="88" x2="450" y2="102"></line>
    <line x1="580" y1="88" x2="580" y2="102"></line>
  </g>
  <g class="dg-label" text-anchor="middle">
    <text x="60" y="122">¥90</text>
    <text x="190" y="122">¥110</text>
    <text x="320" y="122">¥130</text>
    <text x="450" y="122">¥150</text>
    <text x="580" y="122">¥170</text>
  </g>
  <text x="320" y="146" class="dg-label" text-anchor="middle">yen paid per one US dollar</text>

  <text x="60" y="66" class="dg-label-b" text-anchor="start">← STRONGER YEN</text>
  <text x="580" y="66" class="dg-label-b" text-anchor="end">WEAKER YEN →</text>
  <text x="60" y="46" class="dg-label" text-anchor="start">imports cheap · exporters squeezed</text>
  <text x="580" y="46" class="dg-label" text-anchor="end">imports dear · exporters flush</text>

  <circle cx="112" cy="95" r="5" class="dg-ink"></circle>
  <text x="112" y="172" class="dg-label" text-anchor="middle">much of Japan&#39;s</text>
  <text x="112" y="184" class="dg-label" text-anchor="middle">reserves bought here</text>

  <circle cx="535" cy="95" r="5" fill="#8c2f16"></circle>
  <text x="535" y="172" class="dg-label" text-anchor="middle">¥163</text>
  <text x="535" y="184" class="dg-label" text-anchor="middle">July 2026</text>
</svg>
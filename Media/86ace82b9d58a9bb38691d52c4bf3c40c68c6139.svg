<svg viewbox="0 0 640 230" role="img" aria-label="Diagram of rollout-based step labelling: from a candidate step, several completions are sampled, and the step is scored by how many reach a correct final answer.">
  <rect x="20" y="96" width="96" height="38" rx="3" class="dg-box" />
  <text x="68" y="120" class="dg-label-b" text-anchor="middle">step k</text>
  <text x="68" y="152" class="dg-label" text-anchor="middle">score this</text>

  <g class="dg-rule" stroke-width="1.2" fill="none">
    <path d="M 116 115 C 150 115 150 46 186 46" />
    <path d="M 116 115 C 150 115 150 115 186 115" />
    <path d="M 116 115 C 150 115 150 184 186 184" />
  </g>
  <g class="dg-box">
    <rect x="188" y="30" width="140" height="32" rx="2" />
    <rect x="188" y="99" width="140" height="32" rx="2" />
    <rect x="188" y="168" width="140" height="32" rx="2" />
  </g>
  <text x="258" y="50" class="dg-label" text-anchor="middle">roll out to the end</text>
  <text x="258" y="119" class="dg-label" text-anchor="middle">roll out to the end</text>
  <text x="258" y="188" class="dg-label" text-anchor="middle">roll out to the end</text>

  <g class="dg-rule" stroke-width="1.2">
    <line x1="328" y1="46" x2="368" y2="46"></line>
    <line x1="328" y1="115" x2="368" y2="115"></line>
    <line x1="328" y1="184" x2="368" y2="184"></line>
  </g>
  <text x="378" y="51" class="dg-label-b dg-good" text-anchor="start">✓ correct</text>
  <text x="378" y="120" class="dg-label-b dg-bad" text-anchor="start">✕ wrong</text>
  <text x="378" y="189" class="dg-label-b dg-good" text-anchor="start">✓ correct</text>

  <line x1="470" y1="30" x2="470" y2="200" class="dg-rule" stroke-width="1"></line>
  <text x="486" y="94" class="dg-label-b" text-anchor="start">hard label: 1</text>
  <text x="486" y="110" class="dg-label" text-anchor="start">(any rollout succeeded)</text>
  <text x="486" y="134" class="dg-label-b" text-anchor="start">soft label: 2/3</text>
  <text x="486" y="150" class="dg-label" text-anchor="start">(fraction succeeding)</text>
</svg>
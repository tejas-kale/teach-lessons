<svg viewbox="0 0 640 220" role="img" aria-label="Four framings from one Fusion sensor: 26 millimetre, 28, 35, and 52 millimetre crop.">
  <rect x="20" y="28" width="600" height="140" class="dg-box" rx="4" />
  <rect x="70" y="48" width="500" height="100" class="dg-rule" rx="2" />
  <rect x="120" y="58" width="400" height="80" class="dg-rule" />
  <rect x="195" y="68" width="250" height="60" class="dg-rule" />
  <rect x="245" y="78" width="150" height="40" fill="#8c4a16" opacity="0.35" />
  <text x="80" y="44" class="dg-label">1× · 26 mm · the whole street</text>
  <text x="128" y="54" class="dg-label">28 mm crop</text>
  <text x="200" y="64" class="dg-label">35 mm crop</text>
  <text x="250" y="130" class="dg-label-b">2× · 52 mm</text>
  <text x="320" y="190" class="dg-label" text-anchor="middle">Same sensor. Smaller rectangle means you decided what the picture is about.</text>
  <text x="320" y="208" class="dg-label" text-anchor="middle">Past 2× is digital zoom — scouting only.</text>
</svg>
<svg viewbox="0 0 640 300" role="img" aria-label="Two-step diagram: selling dollars drains bank reserves, then buying finance ministry bills restores them.">
  <text x="20" y="22" class="dg-label-b">STEP 1 · the intervention</text>
  <rect x="20" y="34" width="150" height="62" class="dg-box" />
  <text x="95" y="58" class="dg-label-b" text-anchor="middle">Japanese state</text>
  <text x="95" y="76" class="dg-label" text-anchor="middle">sells $95bn</text>
  <rect x="330" y="34" width="150" height="62" class="dg-box" />
  <text x="405" y="58" class="dg-label-b" text-anchor="middle">Commercial banks</text>
  <text x="405" y="76" class="dg-label" text-anchor="middle">pay ¥15.2trn</text>
  <line x1="172" y1="55" x2="326" y2="55" class="dg-stroke" stroke-width="1.3"></line>
  <path d="M 320 50 L 330 55 L 320 60 Z" class="dg-ink" />
  <text x="249" y="46" class="dg-label" text-anchor="middle">dollars →</text>
  <line x1="326" y1="80" x2="174" y2="80" class="dg-stroke" stroke-width="1.3"></line>
  <path d="M 180 75 L 170 80 L 180 85 Z" class="dg-ink" />
  <text x="249" y="97" class="dg-label" text-anchor="middle">← yen, drawn from their BoJ accounts</text>
  <text x="500" y="58" class="dg-label-b" fill="#8c2f16">reserves</text>
  <text x="500" y="76" class="dg-label-b" fill="#8c2f16">FALL ▼</text>

  <line x1="20" y1="126" x2="620" y2="126" class="dg-rule" stroke-width="1" stroke-dasharray="3 3"></line>

  <text x="20" y="160" class="dg-label-b">STEP 2 · the sterilisation</text>
  <rect x="20" y="172" width="150" height="62" class="dg-box" />
  <text x="95" y="196" class="dg-label-b" text-anchor="middle">Bank of Japan</text>
  <text x="95" y="214" class="dg-label" text-anchor="middle">buys the bills back</text>
  <rect x="330" y="172" width="150" height="62" class="dg-box" />
  <text x="405" y="196" class="dg-label-b" text-anchor="middle">Commercial banks</text>
  <text x="405" y="214" class="dg-label" text-anchor="middle">hand over MoF bills</text>
  <line x1="326" y1="193" x2="174" y2="193" class="dg-stroke" stroke-width="1.3"></line>
  <path d="M 180 188 L 170 193 L 180 198 Z" class="dg-ink" />
  <text x="249" y="184" class="dg-label" text-anchor="middle">← government bills</text>
  <line x1="172" y1="218" x2="326" y2="218" class="dg-stroke" stroke-width="1.3"></line>
  <path d="M 320 213 L 330 218 L 320 223 Z" class="dg-ink" />
  <text x="249" y="235" class="dg-label" text-anchor="middle">yen credited back to their accounts →</text>
  <text x="500" y="196" class="dg-label-b" fill="#2f6b40">reserves</text>
  <text x="500" y="214" class="dg-label-b" fill="#2f6b40">RESTORED ▲</text>

  <text x="320" y="272" class="dg-label-b" text-anchor="middle">Net: the money supply is untouched — but ¥15.2trn of government bills</text>
  <text x="320" y="288" class="dg-label-b" text-anchor="middle">is no longer held outside the state, and $95bn of assets is gone.</text>
</svg>
<svg viewbox="0 0 640 200" role="img" aria-label="Three-layer diagram: a generator produces a proof, a verifier critiques it, and a meta-verifier checks whether the verifier&#39;s critique is itself sound.">
  <rect x="30" y="76" width="120" height="48" rx="3" class="dg-box" />
  <text x="90" y="97" class="dg-label-b" text-anchor="middle">GENERATOR</text>
  <text x="90" y="114" class="dg-label" text-anchor="middle">produces a proof</text>

  <line x1="150" y1="100" x2="196" y2="100" class="dg-rule" stroke-width="1.5"></line>
  <polygon points="196,96 205,100 196,104" class="dg-ink"></polygon>

  <rect x="208" y="76" width="120" height="48" rx="3" class="dg-box" />
  <text x="268" y="97" class="dg-label-b" text-anchor="middle">VERIFIER</text>
  <text x="268" y="114" class="dg-label" text-anchor="middle">lists the issues</text>

  <line x1="328" y1="100" x2="374" y2="100" class="dg-rule" stroke-width="1.5"></line>
  <polygon points="374,96 383,100 374,104" class="dg-ink"></polygon>

  <rect x="386" y="66" width="140" height="68" rx="3" class="dg-box" />
  <text x="456" y="88" class="dg-label-b" text-anchor="middle">META-VERIFIER</text>
  <text x="456" y="106" class="dg-label" text-anchor="middle">do those issues</text>
  <text x="456" y="122" class="dg-label" text-anchor="middle">actually exist?</text>

  <path d="M 456 134 C 456 176 90 176 90 128" class="dg-stroke" stroke-width="1.6" fill="none" stroke-dasharray="5 4" />
  <polygon points="86,132 90,122 94,132" class="dg-ink"></polygon>
  <text x="273" y="192" class="dg-label" text-anchor="middle">scores flow back; generator and verifier improve each other</text>

  <text x="560" y="40" class="dg-label-b" text-anchor="middle">catches the</text>
  <text x="560" y="56" class="dg-label-b" text-anchor="middle">fabricated critique</text>
  <line x1="500" y1="62" x2="514" y2="72" class="dg-rule" stroke-width="1"></line>
</svg>
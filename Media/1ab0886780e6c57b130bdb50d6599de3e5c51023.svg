<svg viewbox="0 0 640 250" role="img" aria-label="Sequence from add_data to build">
        <rect x="8" y="8" width="624" height="234" fill="#fff" stroke="#d9d4c8" />
        <rect x="24" y="36" width="170" height="88" fill="#f3f0e8" stroke="#00005f" />
        <text x="36" y="72" font-family="IBM Plex Mono, monospace" font-size="14" fill="#00005f">add_data(df, …)</text>
        <text x="36" y="96" font-family="Iowan Old Style, serif" font-size="13" fill="#5c5c5c">append a series dict</text>
        <text x="206" y="82" font-size="20" fill="#ff7800">→</text>
        <rect x="234" y="36" width="170" height="88" fill="#f3f0e8" stroke="#00005f" />
        <text x="246" y="72" font-family="IBM Plex Mono, monospace" font-size="14" fill="#00005f">render(…)</text>
        <text x="246" y="96" font-family="Iowan Old Style, serif" font-size="13" fill="#5c5c5c">ax.plot / ax.bar</text>
        <text x="416" y="82" font-size="20" fill="#ff7800">→</text>
        <rect x="444" y="36" width="170" height="88" fill="#f3f0e8" stroke="#ff7800" />
        <text x="456" y="72" font-family="IBM Plex Mono, monospace" font-size="14" fill="#00005f">build()</text>
        <text x="456" y="96" font-family="Iowan Old Style, serif" font-size="13" fill="#5c5c5c">declutter + type</text>
        <text x="24" y="168" font-family="Iowan Old Style, serif" font-size="15" fill="#1a1a1a">Intended call: construct → add_data (once or many) → render().</text>
        <text x="24" y="196" font-family="Iowan Old Style, serif" font-size="14" fill="#5c5c5c">render() already calls build(). Calling build() yourself first can duplicate titles.</text>
      </svg>
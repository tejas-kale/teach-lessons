<svg viewbox="0 0 660 250" role="img" aria-label="Pipeline diagram: candidate answers pass through a verifier pool, low-quality verifiers are filtered out, remaining scores are normalised and weighted by estimated accuracy, then a final selection is made.">
  <rect x="16" y="94" width="82" height="42" rx="3" class="dg-box" />
  <text x="57" y="112" class="dg-label-b" text-anchor="middle">k candidate</text>
  <text x="57" y="127" class="dg-label-b" text-anchor="middle">answers</text>

  <rect x="126" y="28" width="128" height="176" rx="3" class="dg-box" />
  <text x="190" y="48" class="dg-label-b" text-anchor="middle">verifier pool</text>
  <text x="190" y="72" class="dg-label" text-anchor="middle">reward models</text>
  <text x="190" y="90" class="dg-label" text-anchor="middle">PRMs</text>
  <text x="190" y="108" class="dg-label" text-anchor="middle">LLM judges</text>
  <text x="190" y="126" class="dg-label" text-anchor="middle">rubric prompts</text>
  <text x="190" y="144" class="dg-label" text-anchor="middle">tool checks</text>
  <text x="190" y="168" class="dg-label" text-anchor="middle">— each imperfect,</text>
  <text x="190" y="184" class="dg-label" text-anchor="middle">each independent —</text>

  <line x1="98" y1="115" x2="122" y2="115" class="dg-rule" stroke-width="1.5"></line>
  <line x1="254" y1="115" x2="284" y2="115" class="dg-rule" stroke-width="1.5"></line>

  <rect x="286" y="66" width="112" height="98" rx="3" class="dg-box" />
  <text x="342" y="90" class="dg-label-b" text-anchor="middle">1 · FILTER</text>
  <text x="342" y="110" class="dg-label" text-anchor="middle">drop verifiers</text>
  <text x="342" y="126" class="dg-label" text-anchor="middle">below a quality</text>
  <text x="342" y="142" class="dg-label" text-anchor="middle">floor</text>

  <line x1="398" y1="115" x2="426" y2="115" class="dg-rule" stroke-width="1.5"></line>

  <rect x="428" y="66" width="112" height="98" rx="3" class="dg-box" />
  <text x="484" y="90" class="dg-label-b" text-anchor="middle">2 · WEIGHT</text>
  <text x="484" y="110" class="dg-label" text-anchor="middle">normalise scores,</text>
  <text x="484" y="126" class="dg-label" text-anchor="middle">weight by estimated</text>
  <text x="484" y="142" class="dg-label" text-anchor="middle">accuracy</text>

  <line x1="540" y1="115" x2="566" y2="115" class="dg-rule" stroke-width="1.5"></line>
  <rect x="568" y="94" width="76" height="42" rx="3" class="dg-box" />
  <text x="606" y="112" class="dg-label-b" text-anchor="middle">3 · SELECT</text>
  <text x="606" y="128" class="dg-label" text-anchor="middle">one answer</text>

  <text x="342" y="196" class="dg-label" text-anchor="middle">the step people skip —</text>
  <text x="342" y="211" class="dg-label" text-anchor="middle">and the one that matters most</text>
</svg>
<svg viewbox="0 0 640 230" role="img" aria-label="What you reuse vs what you write">
        <rect x="16" y="16" width="300" height="198" fill="#f3f0e8" stroke="#00005f" />
        <text x="28" y="44" font-family="Iowan Old Style, serif" font-size="16" fill="#00005f">Reuse (base.py)</text>
        <text x="28" y="76" font-family="IBM Plex Mono, monospace" font-size="13" fill="#1a1a1a">fig, ax, palette</text>
        <text x="28" y="100" font-family="IBM Plex Mono, monospace" font-size="13" fill="#1a1a1a">_configure_layout</text>
        <text x="28" y="124" font-family="IBM Plex Mono, monospace" font-size="13" fill="#1a1a1a">_clean_spines</text>
        <text x="28" y="148" font-family="IBM Plex Mono, monospace" font-size="13" fill="#1a1a1a">label alignment</text>
        <text x="28" y="172" font-family="IBM Plex Mono, monospace" font-size="13" fill="#1a1a1a">title / footnote</text>
        <rect x="332" y="16" width="292" height="198" fill="#fff" stroke="#ff7800" />
        <text x="344" y="44" font-family="Iowan Old Style, serif" font-size="16" fill="#ff7800">Write (new file)</text>
        <text x="344" y="76" font-family="IBM Plex Mono, monospace" font-size="13" fill="#1a1a1a">self._items = []</text>
        <text x="344" y="100" font-family="IBM Plex Mono, monospace" font-size="13" fill="#1a1a1a">add_data → append</text>
        <text x="344" y="124" font-family="IBM Plex Mono, monospace" font-size="13" fill="#1a1a1a">render → artists</text>
        <text x="344" y="148" font-family="IBM Plex Mono, monospace" font-size="13" fill="#1a1a1a">return self.build()</text>
        <text x="344" y="184" font-family="Iowan Old Style, serif" font-size="13" fill="#5c5c5c">then export in both __init__.py</text>
      </svg>
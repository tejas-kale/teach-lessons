<svg viewbox="0 0 660 250" role="img" aria-label="Comparison of parallel sampling, which draws many independent samples and selects one, against sequential revision, which iterates on a single draft.">
  <text x="20" y="24" class="dg-label-b">PARALLEL — independent draws, then select</text>
  <rect x="20" y="38" width="70" height="30" rx="3" class="dg-box" />
  <text x="55" y="58" class="dg-label" text-anchor="middle">prompt</text>
  <g class="dg-box">
    <rect x="150" y="34" width="58" height="20" rx="2" />
    <rect x="150" y="60" width="58" height="20" rx="2" />
    <rect x="150" y="86" width="58" height="20" rx="2" />
  </g>
  <text x="179" y="48" class="dg-label" text-anchor="middle">draw 1</text>
  <text x="179" y="74" class="dg-label" text-anchor="middle">draw 2</text>
  <text x="179" y="100" class="dg-label" text-anchor="middle">draw k</text>
  <g class="dg-rule" stroke-width="1.2">
    <path d="M 90 53 C 120 53 120 44 148 44" fill="none" />
    <path d="M 90 53 C 120 53 120 70 148 70" fill="none" />
    <path d="M 90 53 C 120 53 120 96 148 96" fill="none" />
    <path d="M 208 44 C 240 44 240 70 268 70" fill="none" />
    <path d="M 208 70 L 268 70" fill="none" />
    <path d="M 208 96 C 240 96 240 70 268 70" fill="none" />
  </g>
  <rect x="270" y="54" width="86" height="32" rx="3" class="dg-box" />
  <text x="313" y="74" class="dg-label-b" text-anchor="middle">SELECT</text>
  <text x="400" y="66" class="dg-label" text-anchor="start">latency ≈ one call</text>
  <text x="400" y="82" class="dg-label" text-anchor="start">needs a good selector</text>
  <text x="400" y="98" class="dg-label" text-anchor="start">explores diverse approaches</text>

  <line x1="20" y1="132" x2="640" y2="132" class="dg-rule" stroke-width="1"></line>

  <text x="20" y="162" class="dg-label-b">SEQUENTIAL — one thread, revised</text>
  <rect x="20" y="176" width="70" height="30" rx="3" class="dg-box" />
  <text x="55" y="196" class="dg-label" text-anchor="middle">prompt</text>
  <g class="dg-box">
    <rect x="120" y="176" width="62" height="30" rx="2" />
    <rect x="212" y="176" width="62" height="30" rx="2" />
    <rect x="304" y="176" width="62" height="30" rx="2" />
  </g>
  <text x="151" y="196" class="dg-label" text-anchor="middle">draft</text>
  <text x="243" y="196" class="dg-label" text-anchor="middle">revise</text>
  <text x="335" y="196" class="dg-label" text-anchor="middle">revise</text>
  <g class="dg-rule" stroke-width="1.2">
    <line x1="90" y1="191" x2="116" y2="191"></line>
    <line x1="182" y1="191" x2="208" y2="191"></line>
    <line x1="274" y1="191" x2="300" y2="191"></line>
  </g>
  <text x="400" y="184" class="dg-label" text-anchor="start">latency ≈ k calls</text>
  <text x="400" y="200" class="dg-label" text-anchor="start">needs per-step feedback</text>
  <text x="400" y="216" class="dg-label" text-anchor="start">refines one approach</text>
</svg>
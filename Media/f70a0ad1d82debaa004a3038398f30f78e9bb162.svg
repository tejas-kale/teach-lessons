  <text x="24" y="114" class="dg-label" text-anchor="middle" transform="rotate(-90 24 114)">task length (log)</text>

  <path d="M 80 188 C 220 170 380 110 560 46" class="dg-stroke" stroke-width="2.2" fill="none" />
  <text x="556" y="36" class="dg-label-b" text-anchor="end">50% success — &quot;59 minutes&quot;</text>

  <path d="M 80 196 C 220 188 380 154 560 106" class="dg-stroke" stroke-width="2" fill="none" stroke-dasharray="6 4" />

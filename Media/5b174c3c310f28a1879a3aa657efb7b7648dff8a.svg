<svg viewbox="0 0 640 210" role="img" aria-label="Comparison of time to complete a task: maintainer fast, contractor 5 to 18 times slower, agent tracking contractor times, and agent-with-context in between.">
  <text x="20" y="24" class="dg-label-b">TIME TO COMPLETE THE SAME TASK</text>

  <rect x="150" y="42" width="60" height="24" rx="2" class="dg-box" />
  <text x="140" y="59" class="dg-label-b" text-anchor="end">maintainer</text>
  <text x="222" y="59" class="dg-label" text-anchor="start">has the context in their head</text>

  <rect x="150" y="82" width="420" height="24" rx="2" class="dg-box" />
  <text x="140" y="99" class="dg-label-b" text-anchor="end">contractor</text>
  <text x="360" y="99" class="dg-label" text-anchor="middle">5–18× slower</text>

  <rect x="150" y="122" width="420" height="24" rx="2" class="dg-box" />
  <text x="140" y="139" class="dg-label-b" text-anchor="end">your agent</text>
  <text x="360" y="139" class="dg-label" text-anchor="middle">tracks contractor times</text>

  <rect x="150" y="162" width="200" height="24" rx="2" class="dg-box" />
  <text x="140" y="179" class="dg-label-b" text-anchor="end">agent + context</text>
  <text x="362" y="179" class="dg-label" text-anchor="start">the lever you own</text>
</svg>
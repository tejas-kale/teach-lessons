  <line x1="410" y1="163" x2="444" y2="163" class="dg-rule" stroke-width="1.4"></line>
  <rect x="446" y="146" width="92" height="34" rx="3" class="dg-box" />
  <text x="492" y="167" class="dg-label" text-anchor="middle">reasoning</text>
  <text x="556" y="167" class="dg-label-b dg-good" text-anchor="start">continues</text>

  <line x1="20" y1="104" x2="640" y2="104" class="dg-rule" stroke-width="1"></line>

  <text x="20" y="134" class="dg-label-b">SEARCH-O1</text>
  <rect x="20" y="146" width="92" height="34" rx="3" class="dg-box" />
  <text x="66" y="167" class="dg-label" text-anchor="middle">reasoning</text>
  <line x1="112" y1="163" x2="146" y2="163" class="dg-rule" stroke-width="1.4"></line>
  <rect x="148" y="146" width="76" height="34" rx="3" class="dg-box" />
  <text x="186" y="167" class="dg-label" text-anchor="middle">search</text>
